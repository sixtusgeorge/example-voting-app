name: CI - Build, Scan and Push

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        id: vars
        run: echo "SHA_TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      # ---------- VOTE ----------
      - name: Build and Push Vote image
        uses: docker/build-push-action@v5
        with:
          context: ./vote
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/vote:${{ steps.vars.outputs.SHA_TAG }}
            ${{ env.DOCKERHUB_USERNAME }}/vote:latest

      - name: Scan Vote image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKERHUB_USERNAME }}/vote:${{ steps.vars.outputs.SHA_TAG }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      # ---------- RESULT ----------
      - name: Build and Push Result image
        uses: docker/build-push-action@v5
        with:
          context: ./result
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/result:${{ steps.vars.outputs.SHA_TAG }}
            ${{ env.DOCKERHUB_USERNAME }}/result:latest

      - name: Scan Result image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKERHUB_USERNAME }}/result:${{ steps.vars.outputs.SHA_TAG }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      # ---------- WORKER ----------
      - name: Build and Push Worker image
        uses: docker/build-push-action@v5
        with:
          context: ./worker
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/worker:${{ steps.vars.outputs.SHA_TAG }}
            ${{ env.DOCKERHUB_USERNAME }}/worker:latest

      - name: Scan Worker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKERHUB_USERNAME }}/worker:${{ steps.vars.outputs.SHA_TAG }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'